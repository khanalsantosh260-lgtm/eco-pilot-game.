<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Pilot | Sky Restoration</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #3b82f6;
            --danger: #f43f5e;
            --success: #10b981;
            --text: #f8fafc;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }

        #login-screen, #greeting-screen {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; position: absolute; width: 100%; z-index: 1000; background: var(--bg);
        }
        #greeting-screen { display: none; z-index: 1001; text-align: center; }

        .login-box { background: var(--card); padding: 3rem; border-radius: 15px; text-align: center; width: 350px; border: 1px solid var(--accent); }

        #game-screen { display: none; height: 100vh; flex-direction: row; }
        .sidebar { width: 380px; background: var(--bg); border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 25px; position: relative; box-sizing: border-box; }
        #map-container { flex-grow: 1; z-index: 1; }

        .big-greeting {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent);
            opacity: 0;
            filter: blur(10px);
            animation: cinematicEntry 3s ease-in-out forwards;
        }

        @keyframes cinematicEntry {
            0% { opacity: 0; filter: blur(10px); transform: scale(0.8); }
            40% { opacity: 1; filter: blur(0); transform: scale(1.05); }
            80% { opacity: 1; filter: blur(0); transform: scale(1); }
            100% { opacity: 0; filter: blur(5px); transform: scale(1.1); }
        }

        .stats-container { background: var(--card); padding: 20px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid var(--accent); }
        #co2-val { font-size: 32px; color: var(--danger); font-weight: bold; display: block; }

        #parts-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 25px; }
        .part-slot { height: 55px; background: var(--card); border: 2px solid #334155; border-radius: 10px; display: flex; justify-content: center; align-items: center; opacity: 0.2; font-size: 24px; transition: 0.5s; }
        .part-found { opacity: 1; border-color: var(--success); box-shadow: 0 0 15px var(--success); background: rgba(16, 185, 129, 0.1); }

        .airport-btn { width: 100%; background: var(--card); border: 1px solid #334155; color: white; padding: 15px; margin-bottom: 12px; border-radius: 8px; text-align: left; cursor: pointer; transition: 0.3s; display: flex; justify-content: space-between; align-items: center;}
        .airport-btn:hover { border-color: var(--accent); background: #2d3a4f; }

        #mission-log { height: 220px; background: #000; border-radius: 12px; padding: 20px; font-family: 'Consolas', monospace; font-size: 14px; overflow-y: auto; color: #10b981; border: 1px solid #334155; line-height: 1.6; margin-top: auto; }

        .settings-icon { position: absolute; top: 25px; right: 25px; cursor: pointer; font-size: 24px; z-index: 101; transition: transform 0.3s; }
        .settings-icon:hover { transform: rotate(90deg); color: var(--accent); }
        #settings-panel { display: none; position: absolute; top: 65px; right: 25px; background: var(--card); border: 1px solid var(--accent); padding: 20px; border-radius: 10px; z-index: 100; width: 200px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .plane-icon { font-size: 35px; text-shadow: 0 0 10px white; transition: all 1.5s linear; z-index: 1000; }

        #status-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .status-content { background: var(--card); padding: 50px; border-radius: 20px; text-align: center; border: 2px solid var(--accent); }

        input { width: 100%; box-sizing: border-box; padding: 12px; margin: 20px 0; border-radius: 8px; background: #0f172a; color: white; border: 1px solid #334155; }
        button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h1 style="color:var(--accent)">ECO-PILOT</h1>
            <input type="text" id="player-name-input" placeholder="Pilot Callsign">
            <button onclick="handleLogin()">INITIATE BOOT SEQUENCE</button>
        </div>
    </div>

    <div id="greeting-screen">
        <div id="greeting-text" class="big-greeting"></div>
    </div>

    <div id="game-screen">
        <div class="sidebar">
            <div class="settings-icon" onclick="toggleSettings()">⚙️</div>
            <div id="settings-panel">
                <button onclick="location.reload()" style="width:100%">RESTART MISSION</button>
            </div>

            <h2 id="pilot-name-display" style="margin-top: 0; color: var(--accent);"></h2>

            <div class="stats-container">
                <span style="font-size:11px; opacity:0.6">RESERVE FUEL (CO2 BUDGET)</span>
                <div id="co2-val">10000 kg</div>
                <div style="margin-top:10px; font-size:12px;">FLIGHT HOPS REMAINING: <span id="attempts-val" style="color:var(--accent)">10</span></div>
            </div>

            <div id="parts-grid">
                <div id="part-0" class="part-slot">☀️</div>
                <div id="part-1" class="part-slot">⚙️</div>
                <div id="part-2" class="part-slot">🔋</div>
                <div id="part-3" class="part-slot">🌪️</div>
                <div id="part-4" class="part-slot">💎</div>
            </div>

            <h5 style="margin:0 0 10px 0; color:#64748b; font-size:11px; text-transform: uppercase;">Detected Coordinates</h5>
            <div id="airport-list"></div>

            <div id="mission-log"></div>
        </div>
        <div id="map-container"></div>
    </div>

    <div id="status-overlay">
        <div class="status-content">
            <h1 id="status-title"></h1>
            <p id="status-msg"></p>
            <button onclick="location.reload()">NEW FLIGHT PLAN</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
